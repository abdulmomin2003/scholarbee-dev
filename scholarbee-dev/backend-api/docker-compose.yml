version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3000:3000" 
    command: npm run start:dev
    environment:
      - PORT=3000
      - NODE_ENV=development
      # - MONGODB_URI=${MONGODB_URI}
      # - JWT_SECRET=${JWT_SECRET}
      # - JWT_EXPIRATION=${JWT_EXPIRATION}
      # - FRONTEND_URL=${FRONTEND_URL}
      # - RESEND_API_KEY=${RESEND_API_KEY}
    networks:
      - scholarbee-network
    restart: unless-stopped
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    container_name: scholarbee-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - scholarbee-network
    restart: unless-stopped

  ml-service:
    build: ../ml-service
    container_name: scholarbee-ml-service
    ports:
      - "8002:8002"
    environment:
      - MONGODB_URI=mongodb://host.docker.internal:27017/scholarbee
      - MONGODB_DB_NAME=scholarbee
    volumes:
      - ml_models:/app/models
    depends_on:
      - redis
    networks:
      - scholarbee-network
    restart: unless-stopped

networks:
  scholarbee-network:
    driver: bridge

volumes:
  redis-data:
  ml_models: